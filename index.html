<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ARTESH</title>
<meta name="description" content="A grand-strategy war map of your life. Iran, 1936 borders.">
<meta name="theme-color" content="#11161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARTESH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="emblem" data-act="open" data-sheet="nation" aria-label="Nation overview">
      <svg viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="rc"><circle cx="20" cy="20" r="17"/></clipPath></defs>
        <g clip-path="url(#rc)"><rect x="0" y="0" width="40" height="14" fill="#2f8f5b"/><rect x="0" y="14" width="40" height="12" fill="#f1ecdc"/><rect x="0" y="26" width="40" height="14" fill="#c23b2b"/>
        <circle cx="20" cy="20" r="5.2" fill="#d9b24c" stroke="#7a5c22" stroke-width="1"/></g>
        <circle cx="20" cy="20" r="17.5" fill="none" stroke="#c8a85a" stroke-width="2.2"/></svg>
    </button>
    <div class="topr">
      <div class="ident"><div id="nation-name">Imperial State of Iran</div><div id="nation-date"></div></div>
      <div id="stats" role="list"></div>
    </div>
  </header>
  <div id="alerts"></div>

  <main id="mapwrap">
    <canvas id="base"></canvas>
    <canvas id="over"></canvas>
    <div id="modes" role="toolbar" aria-label="Map modes"></div>
    <div id="zoom">
      <button data-act="zoom" data-k="1.6" aria-label="Zoom in">+</button>
      <button data-act="zoom" data-k="0.625" aria-label="Zoom out">−</button>
      <button data-act="home" aria-label="Centre on Iran">⌖</button>
    </div>
    <div id="legend"></div>
  </main>

  <section id="sheet" hidden aria-live="polite">
    <div class="grip"></div>
    <header><h2 id="sheet-title"></h2><button class="x" data-act="close" aria-label="Close">✕</button></header>
    <div id="sheet-body"></div>
  </section>

  <nav id="nav">
    <button data-act="open" data-sheet="fronts"><svg viewBox="0 0 24 24"><path d="M4 20V5m0 1h11l-2 3.5 2 3.5H4"/></svg><span>Fronts</span></button>
    <button data-act="open" data-sheet="forces"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M3 6l18 12M21 6L3 18"/></svg><span>Forces</span></button>
    <button class="report" data-act="open" data-sheet="report" aria-label="Report"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21m-3.5 0h7"/></svg><span>Report</span></button>
    <button data-act="open" data-sheet="log"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/></svg><span>War log</span></button>
    <button data-act="open" data-sheet="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Staff</span></button>
  </nav>
  <div id="toast" hidden></div>
  <div id="banner" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
