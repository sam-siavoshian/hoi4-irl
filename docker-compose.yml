# docker compose up -d      (create .env from .env.example first)
services:
  homefront:
    build: .
    image: homefront
    container_name: homefront
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      HOMEFRONT_DATA_DIR: /app/private
    ports:
      # Published on this machine only. Put HTTPS (Tailscale, Caddy) in front of it,
      # or change to "8080:8080" if you accept that the password is then the only lock.
      - "127.0.0.1:8080:8080"
    volumes:
      - homefront-data:/app/private
    # A model server on this computer (Ollama, LM Studio, llama.cpp) is at http://host.docker.internal:<port>/v1.
    # Docker Desktop provides that name; this line provides it on Linux. See docs/LOCAL_MODELS.md#docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  homefront-data:
