<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The title, description, canonical address, social cards, icons and structured data are written here at build
     time from site/content/pages.mjs (tools/build-site.mjs), as for every other page of the site. -->
<!--head-->
<meta name="theme-color" content="#f1f1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<!-- The design system's boot script: light or dark and motion are set on <html> before the first paint. -->
<script src="theme-boot.js" vite-ignore></script>
</head>
<body>
<!-- The page's HTML is written in here at build time (tools/build-site.mjs), then hydrated by main.jsx. -->
<div id="root"><!--prerender--></div>
<script type="module" src="./main.jsx"></script>
</body>
</html>
