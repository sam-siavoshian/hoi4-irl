<!doctype html>
<!-- Template for img/og.png (1200×630). Rendered by shots.cjs, which sets the four maps (#m0 to #m3: four of the
     eight countries); not deployed. A picture, not a page: its paints are the design system's dark page, ink and
     muted ink, written out because nothing here loads the kit. The mark is the product's own (Lucide's "map"), not a
     country's flag. -->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #1a1a1d; color: #f4f4f6; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding: 52px 56px 48px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 24px; margin-bottom: 22px; }
  .tile { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(244,244,246,.16); display: grid; place-items: center; }
  .tile svg { width: 23px; height: 23px; }
  h1 { white-space: nowrap; font-size: 72px; line-height: 1.02; font-weight: 600; letter-spacing: -.035em; }
  p { margin-top: 16px; font-size: 26px; line-height: 1.35; color: rgba(244,244,246,.68); white-space: nowrap; }
  .tag { font-size: 20px; font-weight: 500; color: rgba(244,244,246,.44); text-align: right; white-space: nowrap; }
  .maps { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  figure { position: relative; height: 262px; border-radius: 18px; border: 1px solid rgba(255,255,255,.07); overflow: hidden; background: #0b1218; }
  figure img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  figcaption { position: absolute; left: 14px; bottom: 12px; font-size: 18px; font-weight: 600; color: #f4f4f6; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
</style>
