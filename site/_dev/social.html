<!doctype html>
<!-- Template for docs/img/social-preview.png (1280×640, GitHub's social preview). Rendered by shots.cjs, which sets the map behind it; not deployed. -->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { position: relative; width: 1280px; height: 640px; overflow: hidden; background: #0b0e10; color: #f3f1ec; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* a scrim, so the words read at thumbnail size whatever the map shows under them */
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,14,16,.94) 0%, rgba(11,14,16,.86) 38%, rgba(11,14,16,.35) 70%, rgba(11,14,16,.1) 100%); }
  .copy { position: absolute; inset: 80px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand svg { width: 104px; height: 104px; flex: none; }
  h1 { font-size: 136px; line-height: 1; font-weight: 750; letter-spacing: .06em; }
  p { margin-top: 36px; font-size: 52px; line-height: 1.2; font-weight: 550; letter-spacing: -.015em; white-space: nowrap; }
</style>
<img id="bg" alt="">
<div class="scrim"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 40 40"><defs><clipPath id="rc"><circle cx="20" cy="20" r="18"/></clipPath></defs><g clip-path="url(#rc)"><rect width="40" height="14" fill="#3f9467"/><rect y="14" width="40" height="12" fill="#efeadb"/><rect y="26" width="40" height="14" fill="#cf4a39"/><circle cx="20" cy="20" r="4.6" fill="#e3b85c"/></g></svg><h1>ARTESH</h1></div>
  <p>Your life as a 1936 war map.</p>
</div>
