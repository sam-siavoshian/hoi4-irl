name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: No data or secrets in the repository
        run: |
          if git ls-files | grep -iE '(^|/)\.env$|^private/|\.ndjson$|(^|/)state\.json$'; then echo 'A data or secret file is tracked.'; exit 1; fi
          if git grep -nIE 'sk-[A-Za-z0-9_-]{32,}|ghp_[A-Za-z0-9]{30,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- . ':!package-lock.json'; then echo 'Something that looks like a key is committed.'; exit 1; fi
      - run: npm ci
      - name: Build the interface
        run: npm run build
      - name: Design system check
        run: npx sam-design-check src site
      - run: npm test

  e2e:
    name: Browser tests (Chromium, iPhone size)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is not a devDependency (nothing in the app or the map build needs it).
      # tests/e2e.mjs resolves it with createRequire from tests/, which finds ./node_modules/playwright.
      - name: Install Playwright
        run: npm i --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the interface
        run: npm run build
      - run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: tests/shots/
          if-no-files-found: ignore
